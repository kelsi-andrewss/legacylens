name: Deploy to Vercel

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Get or create Vercel project
        id: vercel-project
        run: |
          PROJECT=$(curl -s "https://api.vercel.com/v9/projects/legacylens" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")

          PROJECT_ID=$(echo "$PROJECT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)

          if [ -z "$PROJECT_ID" ]; then
            echo "Project not found — creating..."
            RESULT=$(curl -s -X POST "https://api.vercel.com/v10/projects" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"name":"legacylens","framework":"nextjs"}')
            PROJECT_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          fi

          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT

      - name: Deploy to Vercel
        run: |
          ORG_ID=$(echo "${{ secrets.VERCEL_ORG_ID }}" | tr -d '[:space:]')
          PROJECT_ID="${{ steps.vercel-project.outputs.project_id }}"

          DEPLOY_ARGS="--yes \
            --env OPENAI_API_KEY=$OPENAI_API_KEY \
            --env PINECONE_API_KEY=$PINECONE_API_KEY \
            --env PINECONE_INDEX=$PINECONE_INDEX \
            --token=${{ secrets.VERCEL_TOKEN }}"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Deploying to production..."
            VERCEL_ORG_ID="$ORG_ID" VERCEL_PROJECT_ID="$PROJECT_ID" vercel deploy $DEPLOY_ARGS --prod
          else
            echo "Deploying preview..."
            VERCEL_ORG_ID="$ORG_ID" VERCEL_PROJECT_ID="$PROJECT_ID" vercel deploy $DEPLOY_ARGS
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
